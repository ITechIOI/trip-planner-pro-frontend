name: Frontend Tests

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  fast-checks:
    name: Lint, Typecheck, Vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck app
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:test

      - name: Run Vitest
        run: npm run test

  mocked-e2e:
    name: Mocked Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run mocked E2E
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mocked-e2e-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  accessibility:
    name: Accessibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run accessibility checks
        run: npm run test:a11y

      - name: Upload accessibility artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  visual:
    name: Visual Regression
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run visual regression
        run: npm run test:visual

      - name: Upload visual artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  backend-smoke:
    name: Real Backend Smoke
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      E2E_BACKEND_URL: ${{ secrets.E2E_BACKEND_URL }}
    steps:
      - name: Checkout
        if: env.E2E_BACKEND_URL != ''
        uses: actions/checkout@v4

      - name: Setup Node
        if: env.E2E_BACKEND_URL != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: env.E2E_BACKEND_URL != ''
        run: npm ci

      - name: Install Playwright browsers
        if: env.E2E_BACKEND_URL != ''
        run: npx playwright install --with-deps chromium

      - name: Run backend smoke
        if: env.E2E_BACKEND_URL != ''
        run: npm run test:smoke:backend

      - name: Upload backend smoke artifacts
        if: failure() && env.E2E_BACKEND_URL != ''
        uses: actions/upload-artifact@v4
        with:
          name: backend-smoke-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
